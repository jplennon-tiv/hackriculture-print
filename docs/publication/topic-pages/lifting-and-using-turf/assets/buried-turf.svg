<svg xmlns="http://www.w3.org/2000/svg" width="600" height="375" viewBox="0 25 600 375" role="img" aria-labelledby="title desc">
 <title id="title">Buried turf in a double-dug bed</title>
 <desc id="desc">Topsoil lies above inverted turf, with grass pointing down over loosened subsoil. The subsoil remains below the topsoil.</desc>
