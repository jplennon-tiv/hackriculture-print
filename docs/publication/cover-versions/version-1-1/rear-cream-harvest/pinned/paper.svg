  <use href="#sheet" transform="translate(-.12 .22)" fill="#453a29" opacity=".31" filter="url(#contact)"/>
  <use href="#sheet" fill="url(#stock)" stroke="#b9af9b" stroke-opacity=".23" stroke-width=".12"/>
  <g clip-path="url(#paperClip)">
    <path d="M 48 32 H 124 V 43.8 H 48 Z" fill="url(#bend)"/>
    <path d="M 48.5 43.27 C 63 42.9 69 41.38 79.5 41.37 C 94.4 40.99 105 43.19 123.8 43.34" fill="none" stroke="#fffefa" stroke-width=".31"/>
